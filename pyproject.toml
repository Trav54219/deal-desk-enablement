[project]
name = "deal-desk-enablement"
version = "0.1.0"
description = "Deal desk, pricing and sales enablement toolkit over synthetic data"
requires-python = ">=3.10"
dependencies = ["pyyaml>=6"]

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
dealdesk = "deal_desk.cli:main"

[tool.setuptools]
packages = ["deal_desk"]

[tool.pytest.ini_options]
testpaths = ["tests"]
